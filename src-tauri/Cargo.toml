[package]
name = "who-is-this"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Learn to match faces and names"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde_json = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
